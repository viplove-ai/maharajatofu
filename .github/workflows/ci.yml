name: CI

# Runs on every pull request, and is called by the deploy workflow as its gate
# before anything ships. Deliberately NOT triggered on push to main: deploy.yml
# calls it there, and a plain push trigger would run the whole thing twice.
on:
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      # The migrate script is never exercised by the unit tests and only runs in
      # the deploy pipeline, so a syntax or module-format problem in it used to
      # surface against production. Running it without DATABASE_URL proves it
      # loads and reaches its own error rather than failing to transpile.
      - name: Migration runner loads
        run: |
          out=$(npx tsx src/db/migrate.ts 2>&1) && { echo "expected a failure, got success"; exit 1; }
          echo "$out"
          echo "$out" | grep -q 'DATABASE_URL is not set' || { echo "::error::migrate.ts failed for the wrong reason"; exit 1; }

      # No DATABASE_URL here on purpose. Every page that touches Postgres is
      # marked dynamic, so a production build never queries — and if someone
      # makes a DB-reading page static by accident, this job is where it fails.
      - name: Build
        run: npm run build

  migrations:
    name: Migrations are in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Catches a schema.ts edit that nobody generated a migration for. Without
      # this the mismatch surfaces at deploy time, against the real database.
      - name: Check for ungenerated migrations
        run: |
          npx drizzle-kit generate
          if ! git diff --quiet -- drizzle/; then
            echo "::error::schema.ts has changes with no migration. Run 'npm run db:generate' and commit drizzle/."
            git diff --stat -- drizzle/
            exit 1
          fi
