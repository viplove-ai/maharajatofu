name: CI

on:
  pull_request:
  push:
    branches: [main, release]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      # No DATABASE_URL here on purpose. Every page that touches Postgres is
      # marked dynamic, so a production build never queries — and if someone
      # makes a DB-reading page static by accident, this job is where it fails.
      - name: Build
        run: npm run build

  migrations:
    name: Migrations are in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Catches a schema.ts edit that nobody generated a migration for. Without
      # this the mismatch surfaces at deploy time, against the real database.
      - name: Check for ungenerated migrations
        run: |
          npx drizzle-kit generate
          if ! git diff --quiet -- drizzle/; then
            echo "::error::schema.ts has changes with no migration. Run 'npm run db:generate' and commit drizzle/."
            git diff --stat -- drizzle/
            exit 1
          fi
