# Fly.io config for the Maharaja Tofu site.
# Secrets (DATABASE_URL) are set with `fly secrets set` and never live here —
# this file is committed.

app = "maharaja-tofu"

# Singapore, because Fly deprecated `bom` and there is no longer any India
# region — `sin` is the closest thing available, roughly 60-80 ms from Delhi.
#
# The consolation is that it colocates with the Neon project (ap-southeast-1),
# which matters more now than it would have from Mumbai: the pages that do touch
# Postgres — the signup POST, /thanks, /r/[code] — make their round trips inside
# one datacentre instead of across the Bay of Bengal. Every other page is
# prerendered and never queries at all, so the user-facing cost is a single
# extra hop on first byte.
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"
  build-target = "prod"

  [build.args]
    NEXT_PUBLIC_SITE_URL = "https://maharajatofu.com"
    # Replace with the real WhatsApp Business number before the first deploy.
    NEXT_PUBLIC_WHATSAPP = "910000000000"
    NEXT_PUBLIC_FSSAI = "FSSAI registration in progress"

[http_service]
  internal_port = 3000
  force_https = true
  auto_start_machines = true
  # Node cold-starts in about a second and most pages are prerendered, so
  # suspending to zero between visits is nearly free. Revisit if the ads ever
  # push steady traffic through the machine.
  auto_stop_machines = "suspend"
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"   # Next's server needs more headroom than an nginx SPA
